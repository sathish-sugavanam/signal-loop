services:
  db:
    image: postgres:18.3-alpine
    environment:
      POSTGRES_DB: signal_loop
      POSTGRES_USER: signal_loop
      POSTGRES_PASSWORD: signal_loop
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signal_loop -d signal_loop"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  redis:
    image: redis:8.2-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    command: .venv/bin/python manage.py runserver 0.0.0.0:8000
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: signal_loop
      POSTGRES_USER: signal_loop
      POSTGRES_PASSWORD: signal_loop
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  # The agent services share one image; the worker also starts dev run containers from it.
  agent-webhook:
    build: ./agents
    image: signal-loop-agents
    env_file: ./agents/.env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "127.0.0.1:5001:5001"
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Events are processed one at a time for now; raise --concurrency to scale.
  agent-worker:
    build: ./agents
    image: signal-loop-agents
    command: [".venv/bin/celery", "-A", "signal_loop_agents.celery_app", "worker", "--concurrency=1", "--loglevel=INFO"]
    env_file: ./agents/.env
    depends_on: &worker-deps
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Starts the run containers. Only the worker gets the Docker socket, never a run.
      - /var/run/docker.sock:/var/run/docker.sock
      # Run folders shared with the run containers, at the same path.
      - agent_runs:/runs
    restart: unless-stopped

  # Exactly one beat process: a second one would fire every periodic task twice.
  agent-beat:
    build: ./agents
    image: signal-loop-agents
    command: [".venv/bin/celery", "-A", "signal_loop_agents.celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    env_file: ./agents/.env
    depends_on: *worker-deps
    restart: unless-stopped

volumes:
  postgres_data:
  # Fixed name so the worker can mount it into run containers by name.
  agent_runs:
    name: agent_runs
